# _template.conf - copie esse arquivo pra <MODELO_DO_DEVICE>.conf
#
# O modelo vem de: adb shell getprop ro.product.model
# Exemplos: T2070, L400, L300, TL10
#
# IMPORTANTE: nome do arquivo precisa bater EXATAMENTE com o ro.product.model
# (case-sensitive). O wrapper run_full.sh / run_deep.sh detecta o modelo e
# carrega profiles/<modelo>.conf automaticamente. Se nao existir, cai em
# default.conf.
#
# Use `${VAR:=valor}` em todas as linhas — assim env vars passadas via
# comando (ex: MIN_WRITE_MBPS=80 bash run_full.sh) tem prioridade.

# ============================================================
# Specs do produto (preencher conforme datasheet do SKU)
# ============================================================
# Modelo:     XXX
# Fabricante: XXX
# SoC:        XXX
# RAM:        XXX MB
# Storage:    XXX (eMMC v5.0 / UFS 2.x / etc)
# Capacidade: XXX GB
# Notas:      (qualquer particularidade desse SKU)

# ---- Storage thresholds ----
: "${MIN_WRITE_MBPS:=50}"
: "${MIN_READ_MBPS:=100}"
: "${STORAGE_TEST_SIZE_MB:=512}"

# ---- RAM ----
: "${EXPECTED_RAM_GB:=2}"

# ---- memtester quick ----
: "${QUICK_MEMTEST_PERCENT:=50}"
: "${QUICK_MEMTEST_MAX_MB:=1024}"
: "${QUICK_MEMTEST_MIN_MB:=128}"
: "${QUICK_MEMTEST_LOOPS:=1}"
: "${QUICK_MEMTEST_TIMEOUT_S:=900}"

# ---- memtester deep ----
: "${MEMTEST_PERCENT:=70}"
: "${MEMTEST_MAX_MB:=2048}"
: "${MEMTEST_LOOPS:=3}"
: "${MEMTEST_TIMEOUT_S:=3600}"

# Exporta pro env (necessario)
export MIN_WRITE_MBPS MIN_READ_MBPS STORAGE_TEST_SIZE_MB EXPECTED_RAM_GB
export QUICK_MEMTEST_PERCENT QUICK_MEMTEST_MAX_MB QUICK_MEMTEST_MIN_MB
export QUICK_MEMTEST_LOOPS QUICK_MEMTEST_TIMEOUT_S
export MEMTEST_PERCENT MEMTEST_MAX_MB MEMTEST_LOOPS MEMTEST_TIMEOUT_S
