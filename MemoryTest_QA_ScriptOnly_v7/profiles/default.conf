# default.conf - thresholds genericos pra qualquer device
#
# Esses valores sao usados quando NAO existe um profile especifico pra o
# modelo do device (ex: profiles/L400.conf nao existe, cai aqui).
#
# Sintaxe `${VAR:=valor}` significa "atribui valor SE a variavel ainda nao
# estiver definida". Assim, env vars passadas no comando tem prioridade:
#
#   MIN_WRITE_MBPS=80 bash run_full.sh   <- usa 80, ignora o default
#   bash run_full.sh                      <- usa o que tiver no profile
#
# Os defaults aqui sao CONSERVADORES — toleram devices de baixo desempenho.
# Pra produtos com hardware melhor, criar um profile especifico (ex T2070D.conf)
# com thresholds mais agressivos.

# ---- Storage ----
: "${MIN_WRITE_MBPS:=30}"           # MB/s minimo de escrita
: "${MIN_READ_MBPS:=80}"            # MB/s minimo de leitura
: "${STORAGE_TEST_SIZE_MB:=256}"    # tamanho do arquivo de teste

# ---- RAM ----
: "${EXPECTED_RAM_GB:=1}"           # RAM minima esperada (GB)

# ---- memtester quick (run_full.sh) ----
: "${QUICK_MEMTEST_PERCENT:=40}"    # % da RAM disponivel pra testar
: "${QUICK_MEMTEST_MAX_MB:=512}"    # teto absoluto
: "${QUICK_MEMTEST_MIN_MB:=128}"    # piso absoluto
: "${QUICK_MEMTEST_LOOPS:=1}"       # loops do memtester
: "${QUICK_MEMTEST_TIMEOUT_S:=600}" # timeout (10min)

# ---- memtester deep (run_deep.sh) ----
: "${MEMTEST_PERCENT:=60}"
: "${MEMTEST_MAX_MB:=2048}"
: "${MEMTEST_LOOPS:=3}"
: "${MEMTEST_TIMEOUT_S:=3600}"      # timeout 1h
: "${MIN_MEMTEST_MB:=128}"

# Exporta tudo pro env do shell que vai chamar adb shell
export MIN_WRITE_MBPS MIN_READ_MBPS STORAGE_TEST_SIZE_MB EXPECTED_RAM_GB
export QUICK_MEMTEST_PERCENT QUICK_MEMTEST_MAX_MB QUICK_MEMTEST_MIN_MB
export QUICK_MEMTEST_LOOPS QUICK_MEMTEST_TIMEOUT_S
export MEMTEST_PERCENT MEMTEST_MAX_MB MEMTEST_LOOPS MEMTEST_TIMEOUT_S
export MIN_MEMTEST_MB
