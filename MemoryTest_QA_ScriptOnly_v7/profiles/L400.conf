# L400.conf — Positivo L400
#
# Specs observados (atualize conforme datasheet oficial):
#   Modelo:     L400
#   Fabricante: Positivo
#   SoC:        MediaTek MT6761 (k61v1_32_bsp_1g)
#   ABI:        armeabi-v7a (arm32)
#   RAM:        ~1 GB (860 MB total visto)
#   Storage:    eMMC v5.0
#   Android:    11
#
# Nota: device entry-level, thresholds mais relaxados.

: "${MIN_WRITE_MBPS:=30}"
: "${MIN_READ_MBPS:=80}"
: "${STORAGE_TEST_SIZE_MB:=256}"
: "${EXPECTED_RAM_GB:=1}"

: "${QUICK_MEMTEST_PERCENT:=70}"
: "${QUICK_MEMTEST_MAX_MB:=512}"
: "${QUICK_MEMTEST_MIN_MB:=128}"
: "${QUICK_MEMTEST_LOOPS:=1}"
: "${QUICK_MEMTEST_TIMEOUT_S:=600}"

: "${MEMTEST_PERCENT:=70}"
: "${MEMTEST_MAX_MB:=512}"
: "${MEMTEST_LOOPS:=2}"
: "${MEMTEST_TIMEOUT_S:=1800}"

export MIN_WRITE_MBPS MIN_READ_MBPS STORAGE_TEST_SIZE_MB EXPECTED_RAM_GB
export QUICK_MEMTEST_PERCENT QUICK_MEMTEST_MAX_MB QUICK_MEMTEST_MIN_MB
export QUICK_MEMTEST_LOOPS QUICK_MEMTEST_TIMEOUT_S
export MEMTEST_PERCENT MEMTEST_MAX_MB MEMTEST_LOOPS MEMTEST_TIMEOUT_S
