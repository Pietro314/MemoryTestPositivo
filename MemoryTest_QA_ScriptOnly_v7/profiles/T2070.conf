# T2070.conf — Positivo T2070D
#
# Specs observados (atualize conforme datasheet oficial):
#   Modelo:     T2070D
#   Fabricante: Positivo
#   SoC:        Spreadtrum ums9230_6h10
#   ABI:        arm64-v8a
#   RAM:        2 GB
#   Storage:    eMMC v5.0
#
# Nota: o modelo retornado por `getprop ro.product.model` no T2070D pode vir
# como "T2070" (sem o D). Por isso o arquivo se chama T2070.conf. Verifique
# com `adb shell getprop ro.product.model` no device antes de confiar.

: "${MIN_WRITE_MBPS:=50}"
: "${MIN_READ_MBPS:=150}"
: "${STORAGE_TEST_SIZE_MB:=512}"
: "${EXPECTED_RAM_GB:=2}"

: "${QUICK_MEMTEST_PERCENT:=50}"
: "${QUICK_MEMTEST_MAX_MB:=1024}"
: "${QUICK_MEMTEST_MIN_MB:=128}"
: "${QUICK_MEMTEST_LOOPS:=1}"
: "${QUICK_MEMTEST_TIMEOUT_S:=900}"

: "${MEMTEST_PERCENT:=60}"
: "${MEMTEST_MAX_MB:=1536}"
: "${MEMTEST_LOOPS:=3}"
: "${MEMTEST_TIMEOUT_S:=3600}"

export MIN_WRITE_MBPS MIN_READ_MBPS STORAGE_TEST_SIZE_MB EXPECTED_RAM_GB
export QUICK_MEMTEST_PERCENT QUICK_MEMTEST_MAX_MB QUICK_MEMTEST_MIN_MB
export QUICK_MEMTEST_LOOPS QUICK_MEMTEST_TIMEOUT_S
export MEMTEST_PERCENT MEMTEST_MAX_MB MEMTEST_LOOPS MEMTEST_TIMEOUT_S
