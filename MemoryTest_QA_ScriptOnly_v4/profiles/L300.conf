# L300.conf — Positivo L300 (ou similar Android 7.1)
#
# Specs observados (atualize conforme datasheet oficial):
#   Modelo:     L3 (ro.product.model retornou "L3")
#   Fabricante: Positivo
#   ABI:        armeabi-v7a (arm32)
#   Android:    7.1 (API 25)
#
# Nota: device antigo/entry-level, thresholds bem relaxados.
#
# Atencao: getprop ro.product.model pode retornar "L3" em vez de "L300".
# Confirme rodando `adb shell getprop ro.product.model` e renomeie o
# arquivo conforme necessario (L3.conf ou L300.conf).

: "${MIN_WRITE_MBPS:=20}"
: "${MIN_READ_MBPS:=60}"
: "${STORAGE_TEST_SIZE_MB:=128}"
: "${EXPECTED_RAM_GB:=1}"

: "${QUICK_MEMTEST_PERCENT:=60}"
: "${QUICK_MEMTEST_MAX_MB:=384}"
: "${QUICK_MEMTEST_MIN_MB:=64}"
: "${QUICK_MEMTEST_LOOPS:=1}"
: "${QUICK_MEMTEST_TIMEOUT_S:=600}"

: "${MEMTEST_PERCENT:=60}"
: "${MEMTEST_MAX_MB:=256}"
: "${MEMTEST_LOOPS:=2}"
: "${MEMTEST_TIMEOUT_S:=1200}"

export MIN_WRITE_MBPS MIN_READ_MBPS STORAGE_TEST_SIZE_MB EXPECTED_RAM_GB
export QUICK_MEMTEST_PERCENT QUICK_MEMTEST_MAX_MB QUICK_MEMTEST_MIN_MB
export QUICK_MEMTEST_LOOPS QUICK_MEMTEST_TIMEOUT_S
export MEMTEST_PERCENT MEMTEST_MAX_MB MEMTEST_LOOPS MEMTEST_TIMEOUT_S
